name: Android Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'

jobs:
  build_android_apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/app
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
            echo "SIGNING_ENABLED=true" >> $GITHUB_ENV
          else
            echo "::warning::ANDROID_UPLOAD_KEYSTORE is missing! Building unsigned APKs."
            echo "SIGNING_ENABLED=false" >> $GITHUB_ENV
          fi

      - name: Create Keystore Properties File
        if: env.SIGNING_ENABLED == 'true'
        run: |
          cat <<EOF > android/key.properties
          storeFile=release-key.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android APKs
        run: |
          # 1. Let Flutter prepare the Android project
          flutter build apk --flavor foss --config-only
          
          # 2. Use Gradle to build split APKs directly.
          # Passing -Ptarget-platform ensures we get the specific ABIs requested.
          cd android
          GRADLE_CMD="gradle"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            GRADLE_CMD="./gradlew"
          fi
          
          $GRADLE_CMD assembleFossRelease assembleStandardRelease \
            -Ptarget-platform=android-arm,android-arm64,android-x64 \
            --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_artifacts
          
          echo "Locating and renaming split APKs..."
          
          # Function to rename and copy APKs
          # Pattern matches: app-<flavor>-<abi>-release.apk
          find . -name "*.apk" | while read -r apk_path; do
            filename=$(basename "$apk_path")
            
            # Determine flavor
            if [[ "$filename" == *"foss"* ]]; then
              flavor="FOSS"
            else
              flavor="Standard"
            fi
            
            # Determine ABI
            if [[ "$filename" == *"armeabi-v7a"* ]]; then
              abi="armeabi-v7a"
            elif [[ "$filename" == *"arm64-v8a"* ]]; then
              abi="arm64-v8a"
            elif [[ "$filename" == *"x86_64"* ]]; then
              abi="x86_64"
            else
              abi="universal"
            fi
            
            cp "$apk_path" "release_artifacts/OpenJot-${flavor}-${abi}-${{ github.ref_name }}.apk"
          done

          if [ -z "$(ls -A release_artifacts)" ]; then
            echo "::error::No APKs were found after the build."
            exit 1
          fi

          echo "Successfully collected artifacts:"
          ls -l release_artifacts/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openjot-build-${{ github.ref_name }}
          path: release_artifacts/
