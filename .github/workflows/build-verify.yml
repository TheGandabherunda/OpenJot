name: Android Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'

jobs:
  build_android_apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore File (If Available)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/app
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
            
            # Create the properties file required by build.gradle.kts
            cat <<EOF > android/key.properties
            storeFile=release-key.jks
            storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
            keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
            EOF
            echo "SIGNING_ENABLED=true" >> $GITHUB_ENV
          else
            echo "::warning::ANDROID_UPLOAD_KEYSTORE is missing! Building unsigned APKs (Suitable for F-Droid)."
            echo "SIGNING_ENABLED=false" >> $GITHUB_ENV
          fi

      - name: Build FOSS Flavor (Split APKs)
        run: |
          # Use Flutter's native splitting command for the first flavor
          flutter build apk --release --flavor foss --split-per-abi
          
          mkdir -p release_artifacts
          echo "Finding and renaming FOSS Split APKs..."
          
          # Dynamically find the APKs to avoid hardcoded path errors depending on Flutter versions
          find build/app/outputs/flutter-apk/ -name "*foss*armeabi-v7a*.apk" -exec cp {} release_artifacts/OpenJot-FOSS-armeabi-v7a.apk \;
          find build/app/outputs/flutter-apk/ -name "*foss*arm64-v8a*.apk" -exec cp {} release_artifacts/OpenJot-FOSS-arm64-v8a.apk \;
          find build/app/outputs/flutter-apk/ -name "*foss*x86_64*.apk" -exec cp {} release_artifacts/OpenJot-FOSS-x86_64.apk \;

      - name: Clean Environment for Sequential Build
        run: |
          # Prevent the 'Already watching path' bug by cleaning the workspace before Flavor 2
          flutter clean
          flutter pub get

      - name: Build Standard Flavor (Split APKs)
        run: |
          # Build the second flavor 
          flutter build apk --release --flavor standard --split-per-abi
          
          echo "Finding and renaming Standard Split APKs..."
          
          # Dynamically collect the standard flavor split APKs
          find build/app/outputs/flutter-apk/ -name "*standard*armeabi-v7a*.apk" -exec cp {} release_artifacts/OpenJot-Standard-armeabi-v7a.apk \;
          find build/app/outputs/flutter-apk/ -name "*standard*arm64-v8a*.apk" -exec cp {} release_artifacts/OpenJot-Standard-arm64-v8a.apk \;
          find build/app/outputs/flutter-apk/ -name "*standard*x86_64*.apk" -exec cp {} release_artifacts/OpenJot-Standard-x86_64.apk \;

      - name: Verify Collected Artifacts
        run: |
          echo "Successfully collected artifacts:"
          ls -l release_artifacts/
          
          # Robust check to ensure we generated all 6 split APKs
          APK_COUNT=$(ls -1 release_artifacts/*.apk 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -ne 6 ]; then
            echo "::error::Expected 6 APKs, but found $APK_COUNT! Review the build logs above."
            exit 1
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openjot-build-${{ github.ref_name }}
          path: release_artifacts/
