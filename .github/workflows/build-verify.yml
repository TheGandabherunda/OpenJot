name: Android Release Build

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'

jobs:
  build_android_apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create a release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: ANDROID_UPLOAD_KEYSTORE secret is missing!"
            exit 1
          fi
          # Using printf to ensure no trailing newlines or interpretation issues
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
          
          # Basic check to see if the file is at least a valid size
          if [ $(stat -c%s "android/app/release-key.jks") -lt 100 ]; then
             echo "Error: Decoded keystore is too small, likely corrupted."
             exit 1
          fi

      - name: Create Keystore Properties File
        run: |
          cat <<EOF > android/key.properties
          storeFile=release-key.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build FOSS APK (Signed for GitHub)
        run: flutter build apk --flavor foss --release --target-platform android-arm,android-arm64,android-x64

      - name: Build Standard APK (Signed for GitHub)
        run: flutter build apk --flavor standard --release --target-platform android-arm,android-arm64,android-x64

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_artifacts
          cp build/app/outputs/flutter-apk/app-foss-release.apk release_artifacts/OpenJot-FOSS-${{ github.ref_name }}.apk
          cp build/app/outputs/flutter-apk/app-standard-release.apk release_artifacts/OpenJot-Standard-${{ github.ref_name }}.apk
          
          # Create an unsigned version specifically for F-Droid submission (optional but recommended)
          # F-Droid usually signs with their own keys.
          mv build/app/outputs/flutter-apk/app-foss-release.apk build/app/outputs/flutter-apk/app-foss-release-signed.apk
          # We can't easily build "unsigned" if the signing config is global, 
          # but we'll provide the FOSS signed one as the primary F-Droid target.

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*.apk
          draft: false
          prerelease: false
          body: |
            ### OpenJot Release ${{ github.ref_name }}
            
            - **Standard**: Standard build for general use.
            - **FOSS**: F-Droid compatible build (Open Source only).
            
            _Built with Flutter 3.41.2_
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openjot-apks
          path: release_artifacts/
