name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and Release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
            echo "storeFile=release-key.jks" > android/key.properties
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
            echo "SIGNING_ENABLED=true" >> $GITHUB_ENV
          else
            echo "::warning::Keystore secret is missing. APKs will be unsigned."
            echo "SIGNING_ENABLED=false" >> $GITHUB_ENV
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APKs (Sequential)
        run: |
          mkdir -p release_artifacts
          
          # 1. Build FOSS Flavor
          echo "Building FOSS flavor..."
          flutter build apk --flavor foss --release --split-per-abi --target-platform=android-arm,android-arm64,android-x64
          
          # Rename and move FOSS APKs
          for apk in build/app/outputs/flutter-apk/app-foss-*-release.apk; do
            arch=$(echo $apk | sed -e 's/.*app-foss-//' -e 's/-release.apk//')
            cp "$apk" "release_artifacts/OpenJot-foss-$arch.apk"
          done

          # 2. Clean to prevent "Already watching path" bug
          echo "Cleaning build environment..."
          flutter clean
          flutter pub get

          # 3. Build Standard Flavor
          echo "Building Standard flavor..."
          flutter build apk --flavor standard --release --split-per-abi --target-platform=android-arm,android-arm64,android-x64
          
          # Rename and move Standard APKs
          for apk in build/app/outputs/flutter-apk/app-standard-*-release.apk; do
            arch=$(echo $apk | sed -e 's/.*app-standard-//' -e 's/-release.apk//')
            cp "$apk" "release_artifacts/OpenJot-standard-$arch.apk"
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenJot-APKs
          path: release_artifacts/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
