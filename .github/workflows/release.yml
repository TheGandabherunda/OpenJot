on:
  push:
    branches:
      - main

name: Test, Build and Release apk

env:
  PROPERTIES_PATH: './android/key.properties'

jobs:
  build:
    name: Build APK
    if: "contains(github.event.head_commit.message, 'Update:')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Extract version from commit message
      - name: Extract version
        id: extract_version
        run: |
          version=$(echo ${{ github.event.head_commit.message }} | grep -oP '(?<=Update: v)\d+\.\d+\.\d+')
          echo "version=${version}" >> $GITHUB_OUTPUT

      # Setup Java environment in order to build the Android app.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17.x'

      # Gradle cache for faster builds
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Setup the Flutter environment.
      - run: |
          pip install -U yq
          echo "FLUTTER_VERSION=$(yq -r .environment.flutter pubspec.yaml | sed 's/\^//g')" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: "${{ env.FLUTTER_VERSION }}"

      # Setup keystore properties
      - run: |
          echo keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }} > ${{env.PROPERTIES_PATH}}
          echo storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} >> ${{env.PROPERTIES_PATH}}
          echo keyAlias=${{ secrets.ANDROID_KEY_ALIAS }} >> ${{env.PROPERTIES_PATH}}

      # Decode Keystore
      - run: echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE }}" | base64 --decode > android/app/key.jks

      # Get Flutter dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # Statically analyze the Dart code for any errors
      - name: Analyze Dart code
        run: flutter analyze .

      # Build arm64 APK natively using Gradle
      - name: Build arm64 APK natively using Gradle
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleGithubRelease -Ptarget-platform=android-arm64

      # Release arm64 generated APK
      - name: Release arm64 APK
        uses: svenstaro/upload-release-action@v2
        with:
          repo_name: thegandabherunda/OpenJot
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/app/outputs/apk/github/release/app-arm64-v8a-github-release.apk
          asset_name: OpenJot-arm64-v8a.apk
          tag: ${{ steps.extract_version.outputs.version }}
          prerelease: false
          overwrite: true

      # Build universal APK natively using Gradle
      - name: Build universal APK natively using Gradle
        run: |
          cd android
          ./gradlew assembleGithubRelease

      # Release universal generated APK
      - name: Release universal APK
        uses: svenstaro/upload-release-action@v2
        with:
          repo_name: thegandabherunda/OpenJot
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/app/outputs/apk/github/release/app-github-release.apk
          asset_name: OpenJot.apk
          tag: ${{ steps.extract_version.outputs.version }}
          prerelease: false
          overwrite: true