name: open_jot
description: "A minimal and open-source journaling app to capture your thoughts, moments, and ideas securely on your device."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.4.1+7

environment:
  sdk: ^3.13.0
  flutter: ^3.47.9

dependencies:
  # --- CORE FLUTTER ---
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- STATE MANAGEMENT & ROUTING ---
  get: ^4.7.3

  # --- LOCAL STORAGE ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.6
  markdown_quill: ^4.3.0
  # Imported directly by daily_you_migration_service, so it is declared rather
  # than relying on markdown_quill to pull it in.
  markdown: ^7.3.1

  # --- UI & UX ---
  flutter_quill: ^11.6.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.4.0
  modal_bottom_sheet: ^3.0.0
  progressive_blur: ^0.0.2
  shimmer: ^4.0.0
  smooth_corner: ^1.1.1

  # --- MEDIA & FILE HANDLING ---
  archive: ^4.7.1
  audioplayers: ^6.8.1
  camera: ^0.12.2
  file_picker: ^13.3.3
  get_thumbnail_video: ^0.7.3
  image: ^4.13.1
  pdf: ^3.13.1
  permission_handler: ^13.0.2
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  printing: ^5.15.1
  record: ^7.2.0
  video_player: ^2.14.1

  # --- LOCATION & MAPS ---
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # --- NOTIFICATIONS ---
  # Held at 22.3.3, not 23.0.2. Version 23 declares androidx.core:core:1.19.0,
  # which needs compileSdk 37 and Android Gradle Plugin 9.1.0; this project is
  # on compileSdk 36 and AGP 8.13.0. Verified against the plugin's own
  # android/build.gradle: 22.3.3 and earlier declare core 1.3.0.
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2

  # --- AUTHENTICATION ---
  local_auth: ^3.0.2

  # --- UTILITIES ---
  device_info_plus: ^13.3.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  palette_generator: ^0.3.3+7
  path: ^1.9.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  # --- TESTING ---
  flutter_test:
    sdk: flutter

  # --- CODE ANALYSIS ---
  flutter_lints: ^6.0.0

  # --- CODE GENERATION: none ---
  # hive_generator and build_runner were removed together. hive_generator
  # 2.0.1 is from 2023 and requires build ^2.0.0; every build_runner from
  # 2.5.0 on needs build ^4.0.0 or ^5.0.0. The pair cannot both be current,
  # so the pair is gone. lib/app/core/models/journal_entry.g.dart is
  # committed, and nothing regenerates it unless a HiveField is added to
  # JournalEntry. If that happens, add the pinned pair back temporarily:
  #   dart pub add dev:hive_generator:2.0.1 dev:build_runner:2.4.13
  # and consider moving to hive_ce, whose generator tracks modern
  # build_runner.

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.svg
    - assets/1.svg
    - assets/2.svg
    - assets/3.svg
    - assets/4.svg
    - assets/5.svg
    - assets/6.svg
    - assets/7.svg

  fonts:
    - family: OpenRunde
      fonts:
        - asset: assets/fonts/OpenRunde-Regular.otf
        - asset: assets/fonts/OpenRunde-Medium.otf
          weight: 500
        - asset: assets/fonts/OpenRunde-Semibold.otf
          weight: 600
        - asset: assets/fonts/OpenRunde-Bold.otf
          weight: 700
