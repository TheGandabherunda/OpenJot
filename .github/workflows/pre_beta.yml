on: workflow_dispatch
name: Test, Build and Release debug apk

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Setup Java environment in order to build the Android app.
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17.x'

      # Gradle cache for faster builds
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Setup the flutter environment.
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      # Get flutter dependencies.
      - run: flutter pub get

      # Statically analyze the Dart code for any errors.
      - run: flutter analyze .

      # Build debug apk natively using Gradle
      - name: Build debug apk natively using Gradle
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleGithubDebug

      - uses: svenstaro/upload-release-action@v2
        with:
          repo_name: thegandabherunda/OpenJot
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/app/outputs/apk/github/debug/app-github-debug.apk
          asset_name: OpenJot-debug.apk
          tag: "debug-pre-release"
          prerelease: true
          overwrite: true
          body: "**New OpenJot Debug App!** \n
        with Debug / BETA builds you have access to the latest build of the app. Only use this version if you test the app, provide feedback, and help us improve its performance. Please note that Debug/BETA versions of the app may be pretty unstable. You may experience crashes, bugs, or other issues while using the app..
        "