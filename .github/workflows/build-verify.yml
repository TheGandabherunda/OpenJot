name: Android Release Build (F-Droid Ready)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'

jobs:
  build_android_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Alternatively, specify the exact version from pubspec.yaml
          # flutter-version: '3.27.0' 

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore File (Optional for F-Droid verification)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "${{ secrets.ANDROID_UPLOAD_KEYSTORE }}" ]; then
            echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE }}" | base64 --decode > android/app/release-key.jks
            echo "storeFile=release-key.jks" > android/key.properties
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          fi

      - name: Build Android FOSS APK
        # F-Droid builds typically use the 'foss' flavor if defined
        run: flutter build apk --flavor foss --release --split-per-abi

      - name: Show APK Version Info
        run: |
          AaptPath=$(ls ${ANDROID_HOME}/build-tools/*/aapt | sort -V | tail -n 1)
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "Verifying APK: $apk"
            $AaptPath dump badging "$apk" | grep -E 'package|versionCode|versionName'
          done

      - name: Upload FOSS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openjot-foss-apk
          path: build/app/outputs/flutter-apk/app-foss-*.apk
