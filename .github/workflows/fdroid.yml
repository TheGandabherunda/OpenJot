name: Test, Build and Release Fdroid apk

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PROPERTIES_PATH: './android/key.properties'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, 'Update:')"

    steps:
      - uses: actions/checkout@v4

      # Extract version from commit message
      - name: Extract version
        id: extract_version
        run: |
          version=$(echo ${{ github.event.head_commit.message }} | grep -oP '(?<=Update: v)\d+\.\d+\.\d+')
          echo "version=${version}" >> $GITHUB_OUTPUT

      # Setup Java environment in order to build the Android app.
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17.x'

      # Gradle cache for faster builds
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Setup the flutter environment.
      - run: |
          pip install -U yq
          echo "FLUTTER_VERSION=$(yq -r .environment.flutter pubspec.yaml | sed 's/\^//g')" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: "${{ env.FLUTTER_VERSION }}"

      # Setup keystore properties
      - run: |
          echo keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }} > ${{env.PROPERTIES_PATH}}
          echo storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} >> ${{env.PROPERTIES_PATH}}
          echo keyAlias=${{ secrets.ANDROID_KEY_ALIAS }} >> ${{env.PROPERTIES_PATH}}

      # Decode Keystore
      - run: echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE }}" | base64 --decode > android/app/key.jks

      # Get flutter dependencies.
      - run: flutter pub get

      # Statically analyze the Dart code for any errors.
      - run: flutter analyze .

      # Build Split APKs natively using Gradle
      - name: Build Split APKs natively using Gradle
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleFdroidRelease -Psplit-per-abi=true

      # Upload Split APKs as artifact
      - name: Upload Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: OpenJot-fdroid-splits
          path: android/app/build/outputs/apk/fdroid/release/*.apk

      # Clean release directory to prevent the universal artifact from grabbing splits
      - name: Clean release directory
        run: rm -rf android/app/build/outputs/apk/fdroid/release/*.apk

      # Build universal APK natively using Gradle
      - name: Build universal apk natively using Gradle
        run: |
          cd android
          ./gradlew assembleFdroidRelease

      # Upload universal Fdroid apk
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenJot-fdroid-universal
          path: android/app/build/outputs/apk/fdroid/release/*.apk