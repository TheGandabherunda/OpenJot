name: Android build check

# A debug APK build, on the box-04 self-hosted runner. This is the gate that
# catches native plugin breakage from a dependency bump: pub get, analyze and
# test are all static, while permission_handler, camera, file_picker, record
# and flutter_local_notifications carry Android code.
#
# The runner has Flutter 3.47.9 (the project's declared baseline), the Android
# SDK at /data/workspace/android-sdk and a Gradle home on the root disk, because
# the data disk is too small for a build. Measured: 174 s for a single-ABI
# debug APK.
#
# One ABI. Every plugin's Android code is compiled either way, so this is as
# much of a compile gate as a universal build, and the result is small enough to
# hand to a phone.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/android-build.yml'

jobs:
  apk:
    runs-on: [self-hosted, linux, x64, flutter]
    timeout-minutes: 20
    env:
      ANDROID_HOME: /data/workspace/android-sdk
      ANDROID_SDK_ROOT: /data/workspace/android-sdk
      GRADLE_USER_HOME: /opt/gradle-home
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Put Flutter on the path
        run: echo "/data/workspace/toolchain/flutter-3.47.9/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openjot-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
