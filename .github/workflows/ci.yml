name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch or pull request makes the running job pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Flutter and the Android SDK live on the box-04 runner, so no SDK is
    # downloaded and no cache step is needed.
    runs-on: [self-hosted, linux, x64, flutter]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Put Flutter on the path
        run: echo "/data/workspace/toolchain/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
