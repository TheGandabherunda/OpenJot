on: workflow_dispatch
name: Test, Build and Pre Release Fdroid apk
env:
  PROPERTIES_PATH: './android/key.properties'
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Java environment in order to build the Android app.
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17.x'

      # Gradle cache for faster builds
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Setup the flutter environment.
      - run: |
          pip install -U yq
          echo "FLUTTER_VERSION=$(yq -r .environment.flutter pubspec.yaml | sed 's/\^//g')" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: "${{ env.FLUTTER_VERSION }}"

      # Setup keystore properties
      - run: |
          echo keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }} > ${{env.PROPERTIES_PATH}}
          echo storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} >> ${{env.PROPERTIES_PATH}}
          echo keyAlias=${{ secrets.ANDROID_KEY_ALIAS }} >> ${{env.PROPERTIES_PATH}}

      # Decode Keystore
      - run: echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE }}" | base64 --decode > android/app/key.jks

      # Get flutter dependencies.
      - run: flutter pub get
      
      # Statically analyze the Dart code for any errors.
      - run: flutter analyze .
      
      # Build universal apk natively using Gradle with robust wrapper checks.
      - name: Build universal apk natively using Gradle
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleFdroidRelease

      # Release universal Fdroid pre-release apk.
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_name: thegandabherunda/OpenJot
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/app/outputs/apk/fdroid/release/app-fdroid-release.apk
          asset_name: OpenJot_fdroid.apk
          tag: "fdroid-pre-release"
          prerelease: true
          overwrite: true
          body: "**New OpenJot Fdroid Pre-Release!** \n
          with pre-release / [BETA] builds you have access to the latest build of the app before it is released as stable-release version. Only use pre-release if you test the app, provide feedback, and help us improve its performance. Please note that pre-release versions of the app may be pretty unstable. You may experience crashes, bugs, or other issues while using the app. This is because pre-release version is still in development.
          "