name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          echo "storeFile=release.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build FOSS Flavor
        run: |
          flutter build apk --flavor foss --target-platform android-arm,android-arm64,android-x64 --split-per-abi
          mkdir -p build/outputs/renamed-apks
          mv build/app/outputs/flutter-apk/app-foss-armeabi-v7a-release.apk build/outputs/renamed-apks/OpenJot-foss-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-foss-arm64-v8a-release.apk build/outputs/renamed-apks/OpenJot-foss-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-foss-x86_64-release.apk build/outputs/renamed-apks/OpenJot-foss-x86_64.apk

      - name: Clean Build for Standard
        run: flutter clean && flutter pub get

      - name: Build Standard Flavor
        run: |
          flutter build apk --flavor standard --target-platform android-arm,android-arm64,android-x64 --split-per-abi
          mv build/app/outputs/flutter-apk/app-standard-armeabi-v7a-release.apk build/outputs/renamed-apks/OpenJot-standard-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-standard-arm64-v8a-release.apk build/outputs/renamed-apks/OpenJot-standard-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-standard-x86_64-release.apk build/outputs/renamed-apks/OpenJot-standard-x86_64.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: split-apks
          path: build/outputs/renamed-apks/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/outputs/renamed-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
