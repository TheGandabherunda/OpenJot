name: Android Release Build

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'

jobs:
  build_android_apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/app
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
            echo "SIGNING_ENABLED=true" >> $GITHUB_ENV
          else
            echo "::warning::ANDROID_UPLOAD_KEYSTORE is missing! Building unsigned APKs."
            echo "SIGNING_ENABLED=false" >> $GITHUB_ENV
          fi

      - name: Create Keystore Properties File
        if: env.SIGNING_ENABLED == 'true'
        run: |
          cat <<EOF > android/key.properties
          storeFile=release-key.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build FOSS APK
        run: flutter build apk --flavor foss --release --no-tree-shake-icons

      - name: Build Standard APK
        run: |
          # Clean before second flavor to avoid "Already watching path" errors
          flutter clean
          flutter pub get
          flutter build apk --flavor standard --release --no-tree-shake-icons

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_artifacts
          
          echo "Finding FOSS APK..."
          find build/app/outputs/flutter-apk -name "*foss-release.apk" -exec cp {} release_artifacts/OpenJot-FOSS-${{ github.ref_name }}.apk \;
          
          echo "Finding Standard APK..."
          find build/app/outputs/flutter-apk -name "*standard-release.apk" -exec cp {} release_artifacts/OpenJot-Standard-${{ github.ref_name }}.apk \;

          if [ -z "$(ls -A release_artifacts)" ]; then
            echo "::error::No APKs were found after the build. Checking build directory content..."
            ls -R build/app/outputs/
            exit 1
          fi

          echo "Successfully collected artifacts:"
          ls -l release_artifacts/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openjot-release-apks
          path: release_artifacts/
